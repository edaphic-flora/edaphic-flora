# Weekly refresh for edaphicflora.org:
#   1. finds photos for up to 2,500 more species (iNaturalist, then Wikimedia)
#   2. tests the outbound links (state invasive lists, data sources, policies);
#      a dead link fails the run, so GitHub emails you, and the rebuild still happens
#   3. rebuilds the site so new soil samples and photos show up
#
# Setup (one time):
#   1. Netlify > Site configuration > Build & deploy > Build hooks > Add build hook
#      (branch: main). GitHub secret NETLIFY_BUILD_HOOK = <the URL>
#   2. Run site/sql/species_photos.sql in Neon and create the photo_loader role
#      described at the bottom of that file. GitHub secret
#      PHOTOS_DATABASE_URL = postgresql://photo_loader:<password>@<neon-host>/<db>?sslmode=require
#   (GitHub > repo > Settings > Secrets and variables > Actions > New repository secret)
#
# Either step is skipped if its secret is missing. Each run is one production
# deploy (15 Netlify credits on the free plan). Run it by hand from the
# Actions tab ("Run workflow"); you can set how many species to look up.

name: Weekly site refresh

on:
  schedule:
    - cron: '17 8 * * 1' # Mondays 08:17 UTC
  workflow_dispatch:
    inputs:
      photo_limit:
        description: 'Species to look up photos for (about 1.2 to 2 seconds each)'
        default: '2500'
      rebuild:
        description: 'Trigger a production rebuild afterwards'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Actions are pinned to the commit behind each tag
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Installed in its own step, with no secret in reach and no package
      # install scripts (the photo script only needs plain JavaScript packages)
      - name: Install packages
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Find species photos
        working-directory: site
        env:
          PHOTOS_DATABASE_URL: ${{ secrets.PHOTOS_DATABASE_URL }}
          PHOTO_LIMIT: ${{ inputs.photo_limit || '2500' }}
        run: |
          if [ -z "$PHOTOS_DATABASE_URL" ]; then
            echo "PHOTOS_DATABASE_URL secret is not set yet; skipping photos."
            exit 0
          fi
          npm run fetch-photos

      # Fails the run when a link is plainly dead (404 or a vanished domain).
      # The rebuild below still happens.
      - name: Check outbound links
        if: ${{ always() }}
        working-directory: site
        run: npm run check-links

      # The address is checked on every run, so a badly pasted secret shows up
      # even when no rebuild was asked for. Stray spaces, line breaks and quotes
      # around it are dropped first.
      - name: Trigger Netlify build hook
        if: ${{ always() }}
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          REBUILD: ${{ github.event_name == 'schedule' || inputs.rebuild }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]"'"'"'')"
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set yet; skipping rebuild."
            exit 0
          fi
          case "$HOOK" in
            https://api.netlify.com/build_hooks/?*) ;;
            *)
              echo "::error::NETLIFY_BUILD_HOOK is set but is not a Netlify build hook address. It should start with https://api.netlify.com/build_hooks/ . Copy it again from Netlify (Project configuration, Build & deploy, Build hooks) and save the secret again."
              exit 1
              ;;
          esac
          if [ "$REBUILD" != "true" ]; then
            echo "Build hook address looks right. No rebuild was asked for."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK"
          echo "Build triggered."
