# Netlify settings for edaphicflora.org
#
# In the Netlify UI set "Base directory" to: site
# Netlify then reads this file from site/. With a base directory set,
# Netlify skips the build automatically when nothing under site/ changed,
# so commits that only touch the R app don't spend deploy credits.
# Build-hook builds (the weekly data refresh) always run.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Which species get pages: curated | native | all (see scripts/export-data.mjs)
  SITE_SCOPE = "curated"

# Fingerprinted assets never change, so cache them for a year
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Community soil data download (built by src/pages/data/), licensed CC BY-NC 4.0
[[headers]]
  for = "/data/*.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"
    Link = "<https://creativecommons.org/licenses/by-nc/4.0/>; rel=\"license\""

# Sign-in pages: Firebase loads only here, so they get a strict content
# security policy (Google sign-in popup, Firebase auth APIs, nothing else).
[[headers]]
  for = "/account/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/contribute/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/my-garden/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# Admin page: the same sign-in policy, and kept out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Local testing of the site plus functions: `npx netlify dev` from site/
[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#custom"

# Send the .com to the .org (add both domains in Netlify > Domain management first)
[[redirects]]
  from = "https://edaphicflora.com/*"
  to = "https://edaphicflora.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.edaphicflora.com/*"
  to = "https://edaphicflora.org/:splat"
  status = 301
  force = true

# Old short link to the retired Shiny app (edaphicflora.org/app)
[[redirects]]
  from = "/app"
  to = "/contribute/"
  status = 301
